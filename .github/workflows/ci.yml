name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Xcode command-line tools (preinstalled on macos-latest) provide both
      # the C++ toolchain and libclang for bindgen; no extra setup needed.
      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

  test-windows:
    name: Test (Windows, GNU)
    runs-on: windows-latest
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-gnu
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MinGW-w64 and LLVM
        shell: pwsh
        run: |
          # abieos relies on libstdc++/libc++ semantics (e.g. std::string_view
          # iterators) that MSVC's STL does not provide, so it is built with
          # MinGW-w64 g++ against the x86_64-pc-windows-gnu target. windows-latest
          # ships MSYS2 (MinGW-w64, MSVCRT) at C:\msys64\mingw64 and LLVM at
          # C:\Program Files\LLVM (libclang, required by bindgen).
          "C:\msys64\mingw64\bin"     | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Rust toolchain (gnu target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gnu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gnu-cargo-

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

  test-rust-backend:
    name: Test Rust backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-backend-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-backend-cargo-

      - name: Run Rust backend tests
        run: cargo test --no-default-features --features rust-backend

  test-cpp-oracle:
    name: Test Rust backend against C++ oracle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cpp-oracle-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cpp-oracle-cargo-

      - name: Run differential oracle tests
        run: cargo test --no-default-features --features "rust-backend cpp-oracle"

  fuzz-smoke:
    name: Fuzz/property smoke (Rust backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-fuzz-smoke-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-smoke-cargo-

      # Dependency-free seeded property/fuzz suite. A deeper iteration count
      # than the default (400) is cheap here (~2s for 20k) and meaningfully
      # widens the random-input surface on every push/PR. Coverage-guided
      # deep fuzzing runs on a schedule (.github/workflows/fuzz.yml).
      - name: Run property/fuzz smoke (fixed seed)
        env:
          ABIEOS_FUZZ_ITERS: "20000"
        run: >
          cargo test --no-default-features --features rust-backend
          --test rust_backend_fuzz_property

      - name: Run property/fuzz smoke (run-varying seed)
        env:
          ABIEOS_FUZZ_ITERS: "20000"
          ABIEOS_FUZZ_SEED: ${{ github.run_id }}
        run: >
          cargo test --no-default-features --features rust-backend
          --test rust_backend_fuzz_property

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --engine llvm --out lcov --output-dir ./coverage

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info
