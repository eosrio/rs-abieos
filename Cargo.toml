[package]
name = "rs_abieos"
version = "0.6.0"
edition = "2021"
rust-version = "1.95"
build = "build.rs"
authors = ["Igor Lins e Silva"]
license = "MIT"
repository = "https://github.com/eosrio/rs-abieos"
description = """
A Rust wrapper library for Abieos, used for Antelope (former EOSIO) ABI serialization and deserialization.
"""
categories = ["encoding", "parsing"]
keywords = ["eosio", "antelope", "abi", "serialization", "deserialization"]

[features]
default = ["cpp-backend"]
cpp-backend = ["dep:cc", "dep:bindgen"]
cpp-oracle = ["cpp-backend"]
rust-backend = []

[[bin]]
name = "rs_abieos"
path = "bin-src/main.rs"
doc = false

[build-dependencies]
cc = { version = "1.2.62", features = ["parallel"], optional = true }
bindgen = { version = "0.72.1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "backend_bench"
harness = false

[profile.bench]
lto = true
codegen-units = 1
